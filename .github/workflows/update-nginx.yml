name: Check nginx:alpine-slim updates

on:
  schedule:
    - cron: '8 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get latest update timestamp
        id: check
        run: |
          LAST_UPDATED=$(curl -fsSL https://hub.docker.com/v2/repositories/library/nginx/tags/alpine-slim \
            | jq -r '.last_updated // empty')
          if [ -z "$LAST_UPDATED" ]; then
            echo "Failed to fetch nginx:alpine-slim last_updated timestamp." >&2
            exit 1
          fi
          echo "last_updated=$LAST_UPDATED" >> "$GITHUB_OUTPUT"
          echo "Docker Hub last_updated: $LAST_UPDATED"

      - name: Compare with stored timestamp
        id: compare
        env:
          CURRENT: ${{ steps.check.outputs.last_updated }}
        run: |
          if [ -f .nginx_last_updated ]; then
            PREV=$(cat .nginx_last_updated)
          else
            PREV="(none)"
          fi
          echo "Previous: $PREV"
          echo "Current : $CURRENT"

          if [ "$PREV" = "$CURRENT" ]; then
            echo "No update detected."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "Update detected!"
            echo "updated=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$CURRENT" > .nginx_last_updated
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .nginx_last_updated
            git commit -m "chore: update nginx:alpine-slim timestamp"
            git push
          fi

      - name: Trigger docker workflows
        if: steps.compare.outputs.updated == 'true'
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"nginx_update"}'
