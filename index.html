<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Batch Obfuscator</title>
    <script src="obfu.js" defer></script>
    <style>
        body {
            background: #333333;
            color: #000000;
            font-family: Verdana, sans-serif;
            font-size: 11px;
            margin: 0;
            padding: 1.2em 0 0 0;
            text-align: center;
        }

        table {
            font-size: 11px;
            text-align: center;
            margin: 0 auto 5px auto;
            border: 1px solid #000000;
            border-spacing: 1px;
        }

        textarea {
            height: 400px;
            width: 600px;
            max-width: 95vw;
            font-family: Verdana, sans-serif;
            font-size: 11px;
            color: #CCCCCC;
            background: #444444;
            border: 1px solid #000000;
            display: inline;
            margin: 0;
        }

        textarea::placeholder {
            color: #888888;
        }

        .noir {
            background: #000000;
            color: #CCCCCC;
            border-bottom: 2px solid #000000;
            border-top: 2px solid #000000;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <td>
                <div class="noir">Batch Code</div>
            </td>
            <td>
                <div class="noir">Batch Code Obfu</div>
            </td>
        </tr>
        <tr>
            <td>
                <textarea id="Code" aria-label="Batch code to obfuscate"
                    placeholder="Paste your batch code here..."></textarea>
            </td>
            <td>
                <textarea id="ObfCode" aria-label="Obfuscated batch code" readonly
                    placeholder="Obfuscated code will appear here..."></textarea>
            </td>
        </tr>
    </table>
</body>

</html>
