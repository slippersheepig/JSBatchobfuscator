<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Batch Obfuscator</title>
    <script src="obfu.js" defer></script>
    <style>
        :root {
            --bg-page: #12151c;
            --bg-panel: #181d26;
            --bg-header: #1c222d;
            --bg-editor: #0f131a;
            --bg-btn: #242c3a;
            --bg-btn-hover: #2e384a;
            --border: #2a3342;
            --border-strong: #39465c;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-ring: rgba(59, 130, 246, 0.45);
            --success: #15803d;
            --warning: #f0b429;
            --text-primary: #e6edf3;
            --text-label: #c9d4e3;
            --text-muted: #8b98ab;
            --text-placeholder: #7d899b;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg-page);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            padding: 28px 20px 36px;
        }

        .page-header {
            margin-bottom: 20px;
        }

        .page-title {
            margin: 0 0 4px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }

        .page-subtitle {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        .editor-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .panel {
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.15s ease;
        }

        .panel:focus-within {
            border-color: var(--border-strong);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 12px;
            min-height: 46px;
            padding: 8px 14px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border);
        }

        .panel-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-label);
            white-space: nowrap;
        }

        .panel-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: auto;
            height: 28px;
            padding: 0 11px;
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            background: var(--bg-btn);
            color: #dce4f0;
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 500;
            line-height: 1;
            white-space: nowrap;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
        }

        .btn:hover:not(:disabled) {
            background: var(--bg-btn-hover);
            border-color: #4a5a75;
        }

        .btn:active:not(:disabled) {
            transform: translateY(0.5px);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent-ring);
            outline-offset: 1px;
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--accent);
            border-color: transparent;
            color: #ffffff;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent-hover);
            border-color: transparent;
        }

        .btn-success,
        .btn-success:hover:not(:disabled) {
            background: var(--success);
            border-color: transparent;
            color: #ffffff;
        }

        .code-area {
            display: block;
            width: 100%;
            height: clamp(340px, 62vh, 620px);
            min-height: 260px;
            margin: 0;
            padding: 14px 16px;
            border: 0;
            background: var(--bg-editor);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.6;
            tab-size: 4;
            resize: vertical;
            scrollbar-width: thin;
            scrollbar-color: var(--border-strong) var(--bg-editor);
        }

        .code-area::placeholder {
            color: var(--text-placeholder);
        }

        .code-area:focus {
            outline: none;
        }

        .panel-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            min-height: 32px;
            padding: 6px 14px;
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-muted);
        }

        .warning-text {
            color: var(--warning);
            font-weight: 500;
        }

        @media (max-width: 820px) {
            .container {
                padding: 20px 14px 28px;
            }

            .editor-grid {
                grid-template-columns: 1fr;
            }

            .code-area {
                height: 300px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <header class="page-header">
            <h1 class="page-title">Batch Obfuscator</h1>
            <p class="page-subtitle">Obfuscate Windows Batch scripts using randomized variable substitution.</p>
        </header>

        <div class="editor-grid">
            <section class="panel" aria-label="Source batch code">
                <div class="panel-header">
                    <label class="panel-label" for="Code">Batch Code</label>
                    <div class="panel-actions">
                        <button type="button" id="ClearBtn" class="btn" disabled>Clear</button>
                    </div>
                </div>
                <textarea id="Code" class="code-area" spellcheck="false" autocomplete="off" autocapitalize="off"
                    placeholder="Paste your batch code here..."></textarea>
                <div class="panel-footer">
                    <span id="InputStats">0 lines · 0 chars</span>
                </div>
            </section>

            <section class="panel" aria-label="Obfuscated batch code">
                <div class="panel-header">
                    <label class="panel-label" for="ObfCode">Obfuscated Code</label>
                    <div class="panel-actions">
                        <button type="button" id="RegenBtn" class="btn" disabled>Regenerate</button>
                        <button type="button" id="DownloadBtn" class="btn" disabled>Download</button>
                        <button type="button" id="CopyBtn" class="btn btn-primary" disabled>Copy</button>
                    </div>
                </div>
                <textarea id="ObfCode" class="code-area" readonly spellcheck="false"
                    placeholder="Obfuscated code will appear here..."></textarea>
                <div class="panel-footer">
                    <span id="OutputStats">0 lines · 0 chars</span>
                    <span id="LengthWarning" class="warning-text" role="status" aria-live="polite" hidden></span>
                </div>
            </section>
        </div>
    </main>
</body>

</html>
